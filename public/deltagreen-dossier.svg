<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="600" fill="#040604"/>
  <!-- Terminal output -->
  <g fill="#6fe07a" fill-opacity=".38">
    <rect x="40" y="92" width="44" height="7"/><rect x="92" y="92" width="120" height="7"/>
    <rect x="40" y="108" width="24" height="7"/><rect x="72" y="108" width="84" height="7"/><rect x="164" y="108" width="60" height="7"/>
    <rect x="40" y="124" width="150" height="7"/>
  </g>
  <g fill="#6fe07a" fill-opacity=".16">
    <rect x="40" y="140" width="96" height="7"/><rect x="144" y="140" width="44" height="7"/>
  </g>
  <rect x="236" y="106" width="96" height="11" fill="#000" stroke="#6fe07a" stroke-opacity=".25"/>
  <rect x="200" y="122" width="132" height="11" fill="#000" stroke="#6fe07a" stroke-opacity=".25"/>
  <!-- Delta -->
  <path d="M200 182 292 342H108Z" fill="none" stroke="#6fe07a" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M200 182 292 342H108Z" fill="none" stroke="#6fe07a" stroke-opacity=".18" stroke-width="18" stroke-linejoin="miter"/>
  <!-- Scanlines -->
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".45"/></pattern>
  <rect width="400" height="600" fill="url(#scan)"/>
</svg>
